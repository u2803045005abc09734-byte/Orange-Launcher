[package]
name = "oneclient_app"
description = "Orange Client Minecraft Launcher"
version = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }

[[bin]]
name = "orange-client"
path = "src/main.rs"

[features]
default = []

[dependencies]
oneclient_auth.workspace = true
oneclient_cluster.workspace = true
oneclient_common.workspace = true
oneclient_content.workspace = true
oneclient_events.workspace = true
oneclient_java.workspace = true
oneclient_mc.workspace = true
oneclient_polyplus.workspace = true
oneclient_net.workspace = true
oneclient_core.workspace = true
oneclient_db.workspace = true
chrono.workspace = true
oneclient_macro = { workspace = true, features = ["freya"] }

accesskit.workspace = true
polyio.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true

tracing.workspace = true
tracing-subscriber.workspace = true
futures-util.workspace = true
tokio.workspace = true
uuid.workspace = true
bytes.workspace = true
sys-locale.workspace = true
sysinfo.workspace = true
inventory.workspace = true

notify.workspace = true

anyhow.workspace = true
regex.workspace = true
emojis.workspace = true
directories.workspace = true
dunce.workspace = true
percent-encoding.workspace = true

cargo-packager-updater = "=0.2.3"

# rfd = "=0.17.2"
# open = "=5.4.0"
rfd.workspace = true
open.workspace = true
url.workspace = true

# clipboard image copy + decode for it
arboard.workspace = true
image.workspace = true

freya-skia-safe.workspace = true
plusrenderer.workspace = true
freya.workspace = true
freya-core.workspace = true
pulldown-cmark.workspace = true
# inlines svg logos embedded in markdown badges as data urls
base64.workspace = true

[dev-dependencies]
freya-testing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
mimalloc = "=0.1.52"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(windows)'.dependencies]
freya-winit.workspace = true
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Registry",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "=0.1.31"

[package.metadata.packager]
product-name = "Orange Client"
identifier = "dev.orangeclient.launcher"
category = "Game"
publisher = "Orange Client Community"
copyright = "© 2023-2026 Polyfrost and contributors; Orange Client fork modifications © 2026"
long-description = "An open-source Minecraft launcher fork with Orange Client branding."
formats = ["nsis"]
binaries = [{ path = "orange-client", main = true }]
icons = ["icons/icon.ico"]
resources = []

[package.metadata.packager.windows]
digest-algorithm = "sha256"
timestamp-url = "https://timestamp.digicert.com"

[package.metadata.packager.nsis]
preinstall-section = """
Section "-OrangeClientWaitForExit"
  ; The updater starts this installer unattended and then quits. The packager's own
  ; running-app check kills and sleeps a fixed 500 ms without confirming the exit, so
  ; give the launcher up to 10 s to close by itself first. Interactive installs skip
  ; this and go straight to the packager's prompt.
  ${If} $PassiveMode = 1
  ${OrIf} ${Silent}
    StrCpy $R1 0
    orange_client_wait:
      nsis_tauri_utils::FindProcess "${MAINBINARYNAME}.exe"
      Pop $R0
      ${If} $R0 = 0
      ${AndIf} $R1 < 40
        IntOp $R1 $R1 + 1
        Sleep 250
        Goto orange_client_wait
      ${EndIf}
  ${EndIf}
SectionEnd

; >>> VC_REDIST_SECTION >>>
Section "-VCRedist"
  SetRegView 64
  ReadRegDWORD $R0 HKLM "SOFTWARE\\Microsoft\\VisualStudio\\14.0\\VC\\Runtimes\\X64" "Installed"
  ReadRegDWORD $R1 HKLM "SOFTWARE\\Microsoft\\VisualStudio\\14.0\\VC\\Runtimes\\X64" "Minor"
  SetRegView lastused

  ${If} $R0 == 1
  ${AndIf} $R1 >= 40
    Goto vcredist_done
  ${EndIf}

  ${If} $PassiveMode != 1
    MessageBox MB_OK|MB_ICONEXCLAMATION "This build of Orange Client needs the Microsoft Visual C++ Redistributable (x64) 14.40 or newer. Install it from https://aka.ms/vs/17/release/vc_redist.x64.exe, then run this installer again."
  ${EndIf}

  vcredist_done:
SectionEnd
; <<< VC_REDIST_SECTION <<<
"""

