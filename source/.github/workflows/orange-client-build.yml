name: Orange Client Windows Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build launcher executable
        env:
          ORANGE_CLIENT_MICROSOFT_CLIENT_ID: ${{ secrets.ORANGE_CLIENT_MICROSOFT_CLIENT_ID }}
          ORANGE_CLIENT_CURSEFORGE_API_KEY: ${{ secrets.ORANGE_CLIENT_CURSEFORGE_API_KEY }}
          ORANGE_CLIENT_DISCORD_CLIENT_ID: ${{ secrets.ORANGE_CLIENT_DISCORD_CLIENT_ID }}
          ORANGE_CLIENT_SENTRY_DSN: ${{ secrets.ORANGE_CLIENT_SENTRY_DSN }}
          ORANGE_CLIENT_CHANGELOG_URL: ${{ secrets.ORANGE_CLIENT_CHANGELOG_URL }}
        run: cargo build --locked --release -p oneclient_app --bin orange-client

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Create Windows installer
        env:
          ORANGE_CLIENT_MICROSOFT_CLIENT_ID: ${{ secrets.ORANGE_CLIENT_MICROSOFT_CLIENT_ID }}
          ORANGE_CLIENT_CURSEFORGE_API_KEY: ${{ secrets.ORANGE_CLIENT_CURSEFORGE_API_KEY }}
          ORANGE_CLIENT_DISCORD_CLIENT_ID: ${{ secrets.ORANGE_CLIENT_DISCORD_CLIENT_ID }}
          ORANGE_CLIENT_SENTRY_DSN: ${{ secrets.ORANGE_CLIENT_SENTRY_DSN }}
          ORANGE_CLIENT_CHANGELOG_URL: ${{ secrets.ORANGE_CLIENT_CHANGELOG_URL }}
        run: cargo packager --release -p oneclient_app --formats nsis

      - name: Upload Orange Client executable
        uses: actions/upload-artifact@v4
        with:
          name: Orange-Client-Windows-x64-Portable
          path: target/release/orange-client.exe
          if-no-files-found: error

      - name: Upload Orange Client installer
        uses: actions/upload-artifact@v4
        with:
          name: Orange-Client-Windows-x64-Setup
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
