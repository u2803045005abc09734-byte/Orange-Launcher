name: Rust Dependency Security Audit

on:
  push:
    branches: [main]
    paths:
      - "source/Cargo.toml"
      - "source/Cargo.lock"
      - "source/packages/**/Cargo.toml"
      - ".github/workflows/rust-security-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "source/Cargo.toml"
      - "source/Cargo.lock"
      - "source/packages/**/Cargo.toml"
      - ".github/workflows/rust-security-audit.yml"
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Check locked Rust dependencies for known advisories
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Cargo.lock
        working-directory: source
        run: cargo audit
